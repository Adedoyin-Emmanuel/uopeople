<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three.js Virtual Laboratory</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        overflow:hidden;
        background:#ececec;
        font-family:Arial, Helvetica, sans-serif;
    }

    #info{
        position:absolute;
        top:15px;
        left:15px;
        background:rgba(255,255,255,.9);
        padding:12px;
        border-radius:8px;
        z-index:100;
        line-height:1.6;
    }
</style>
</head>

<body>

<div id="info">
    <strong>Virtual Physics Laboratory</strong><br>
    Metallic Apparatus = Front Object<br>
    Glass Beaker = Container<br>
    Sphere &amp; Cube = Objects Inside<br>
    Laboratory Stand = Back Object
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.165/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165/examples/jsm/"
    }
}
</script>

<script type="module">

import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

/* -------------------------------------------------- */
/* Constants */
/* -------------------------------------------------- */

const TABLE_TOP_Y = 1.15;   // world Y of the bench surface everything sits on

/* -------------------------------------------------- */
/* Scene */
/* -------------------------------------------------- */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9edf0);

/* -------------------------------------------------- */
/* Camera */
/* -------------------------------------------------- */

const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

// Tighter, more centered framing so the lab fills the frame and the
// front-apparatus / beaker / back-stand depth stack reads clearly at a glance.
camera.position.set(2.2, 3.5, 7.0);

/* -------------------------------------------------- */
/* Renderer */
/* -------------------------------------------------- */

const renderer = new THREE.WebGLRenderer({

    antialias:true          // Change to false for screenshot A

});

renderer.setSize(window.innerWidth,window.innerHeight);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);

// Generate a soft, neutral environment map so glass and metal surfaces pick
// up subtle reflections instead of looking flat/matte.
const pmremGenerator = new THREE.PMREMGenerator(renderer);
scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

/* -------------------------------------------------- */
/* Controls */
/* -------------------------------------------------- */

const controls = new OrbitControls(camera, renderer.domElement);

controls.enableDamping = true;
controls.target.set(0, TABLE_TOP_Y + 0.55, -0.2);
controls.minDistance = 3;
controls.maxDistance = 20;
controls.maxPolarAngle = Math.PI / 2.05;
controls.update();

/* -------------------------------------------------- */
/* Lighting */
/* -------------------------------------------------- */

function createLighting(scene){

    const hemi = new THREE.HemisphereLight(0xffffff, 0x2f2a24, 0.8);
    scene.add(hemi);

    // Softer key light: lower intensity + a shadow radius so shadow edges
    // blur instead of cutting hard lines across the bench.
    const sun = new THREE.DirectionalLight(0xfff2df, 1.1);
    sun.position.set(6, 9, 5);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -7;
    sun.shadow.camera.right = 7;
    sun.shadow.camera.top = 7;
    sun.shadow.camera.bottom = -7;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 25;
    sun.shadow.bias = -0.0015;
    sun.shadow.radius = 6;
    scene.add(sun);

    const fill = new THREE.PointLight(0xaee2ff, 0.45, 14);
    fill.position.set(-4, 3.5, 4);
    scene.add(fill);

    return { hemi, sun, fill };
}

/* -------------------------------------------------- */
/* Room: floor + wall + wooden bench */
/* -------------------------------------------------- */

function createFloor(){

    const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(26, 26),
        new THREE.MeshStandardMaterial({ color:0xcfd3d6, roughness:1 })
    );

    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;

    return floor;
}

function createWall(){

    const wall = new THREE.Mesh(
        new THREE.PlaneGeometry(26, 12),
        new THREE.MeshStandardMaterial({ color:0xe6e9ec, roughness:0.95 })
    );

    wall.position.set(0, 6, -6.4);
    wall.receiveShadow = true;

    return wall;
}

function createTable(){

    const group = new THREE.Group();

    // Slightly different tone/roughness between the tabletop and legs so the
    // wood doesn't read as one flat, uniform material.
    const woodTop = new THREE.MeshStandardMaterial({
        color:0x8a5a34,
        roughness:0.68,
        metalness:0.04
    });

    const woodLeg = new THREE.MeshStandardMaterial({
        color:0x74492b,
        roughness:0.74,
        metalness:0.04
    });

    const top = new THREE.Mesh(new THREE.BoxGeometry(11, 0.3, 6.2), woodTop);
    top.position.y = TABLE_TOP_Y - 0.15;
    top.castShadow = true;
    top.receiveShadow = true;
    group.add(top);

    const legGeometry = new THREE.BoxGeometry(0.3, TABLE_TOP_Y - 0.3, 0.3);
    const legPositions = [
        [-5.1, -2.7], [5.1, -2.7],
        [-5.1,  2.7], [5.1,  2.7]
    ];

    legPositions.forEach(([x, z]) => {
        const leg = new THREE.Mesh(legGeometry, woodLeg);
        leg.position.set(x, (TABLE_TOP_Y - 0.3) / 2, z);
        leg.castShadow = true;
        leg.receiveShadow = true;
        group.add(leg);
    });

    return group;
}

/* -------------------------------------------------- */
/* Glass Beaker (container) */
/* -------------------------------------------------- */

function createBeaker(radius = 0.9, height = 1.7){

    const group = new THREE.Group();

    // Visual fix: previous glass (opacity .2, transmission 1, no ior/tint)
    // read as almost invisible. Slightly lower transmission + higher opacity
    // + a blue tint + a touch of roughness/clearcoat gives it a readable
    // edge and subtle reflections while contents inside stay clearly visible.
    const glassMaterial = new THREE.MeshPhysicalMaterial({
        color:0x9fd4ec,
        transparent:true,
        opacity:0.32,
        roughness:0.06,
        metalness:0,
        transmission:0.92,
        thickness:0.6,
        ior:1.52,
        reflectivity:0.5,
        clearcoat:1,
        clearcoatRoughness:0.08,
        attenuationColor:0x6fb8e0,
        attenuationDistance:1.1,
        envMapIntensity:1.3,
        side:THREE.DoubleSide
    });

    const wall = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius * 0.95, height, 64, 1, true),
        glassMaterial
    );
    wall.position.y = height / 2;
    wall.castShadow = true;
    group.add(wall);

    // Thin circular base with real thickness (a flat Circle was nearly
    // invisible) so the beaker has a visible footing.
    const base = new THREE.Mesh(
        new THREE.CylinderGeometry(radius * 0.95, radius * 0.95, 0.05, 64),
        glassMaterial
    );
    base.position.y = 0.025;
    group.add(base);

    // Rolled rim around the top opening, thickened slightly for visibility
    const rim = new THREE.Mesh(
        new THREE.TorusGeometry(radius, 0.045, 20, 64),
        glassMaterial
    );
    rim.rotation.x = Math.PI / 2;
    rim.position.y = height;
    group.add(rim);

    return group;
}

/* -------------------------------------------------- */
/* Lab Mat (subtle tabletop detail beneath the beaker) */
/* -------------------------------------------------- */

function createLabMat(radius = 1.05){

    return new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, 0.02, 48),
        new THREE.MeshStandardMaterial({ color:0x2b2b2b, roughness:0.9, metalness:0.05 })
    );
}

/* -------------------------------------------------- */
/* Erlenmeyer Flask */
/* -------------------------------------------------- */

function createFlask(){

    const profile = [
        new THREE.Vector2(0,     0.00),
        new THREE.Vector2(0.62,  0.00),
        new THREE.Vector2(0.58,  0.10),
        new THREE.Vector2(0.30,  0.80),
        new THREE.Vector2(0.16,  0.92),
        new THREE.Vector2(0.16,  1.15),
        new THREE.Vector2(0.19,  1.17)
    ];

    const geometry = new THREE.LatheGeometry(profile, 32);

    const material = new THREE.MeshPhysicalMaterial({
        color:0xdff6ff,
        transparent:true,
        opacity:0.18,
        roughness:0,
        metalness:0,
        transmission:1,
        thickness:0.3,
        ior:1.45,
        side:THREE.DoubleSide
    });

    const flask = new THREE.Mesh(geometry, material);
    flask.castShadow = true;

    return flask;
}

/* -------------------------------------------------- */
/* Test Tube */
/* -------------------------------------------------- */

function createTestTube(){

    const group = new THREE.Group();

    // Small wooden holder block + ring so the tube rests upright like it
    // would in a real rack, instead of tilted flat on the bench.
    const holderBase = new THREE.Mesh(
        new THREE.BoxGeometry(0.46, 0.12, 0.3),
        new THREE.MeshStandardMaterial({ color:0x6b4423, roughness:0.8, metalness:0.05 })
    );
    holderBase.position.y = 0.06;
    holderBase.castShadow = true;
    holderBase.receiveShadow = true;
    group.add(holderBase);

    const holderRing = new THREE.Mesh(
        new THREE.TorusGeometry(0.18, 0.025, 12, 24),
        new THREE.MeshStandardMaterial({ color:0x2b2b2b, roughness:0.6, metalness:0.2 })
    );
    holderRing.rotation.x = Math.PI / 2;
    holderRing.position.y = 0.12;
    group.add(holderRing);

    const glass = new THREE.MeshPhysicalMaterial({
        color:0xe8f7ff,
        transparent:true,
        opacity:0.28,
        roughness:0.05,
        transmission:0.9,
        thickness:0.2,
        ior:1.45,
        envMapIntensity:1.1,
        side:THREE.DoubleSide
    });

    const body = new THREE.Mesh(
        new THREE.CylinderGeometry(0.16, 0.16, 1.2, 32, 1, true),
        glass
    );
    body.position.y = 0.72;
    body.castShadow = true;
    group.add(body);

    const cap = new THREE.Mesh(
        new THREE.SphereGeometry(0.16, 32, 32, 0, Math.PI * 2, 0, Math.PI / 2),
        glass
    );
    cap.rotation.x = Math.PI;
    cap.position.y = 0.12;
    group.add(cap);

    const liquid = new THREE.Mesh(
        new THREE.CylinderGeometry(0.13, 0.13, 0.45, 32),
        new THREE.MeshStandardMaterial({ color:0x66c2ff, roughness:0.22, transparent:true, opacity:0.9 })
    );
    liquid.position.y = 0.36;
    group.add(liquid);

    return group;
}

/* -------------------------------------------------- */
/* Graduated Cylinder */
/* -------------------------------------------------- */

function createMeasurementCylinder(){

    const group = new THREE.Group();

    const glass = new THREE.MeshPhysicalMaterial({
        color:0xfff3d6,
        transparent:true,
        opacity:0.25,
        roughness:0,
        transmission:1,
        thickness:0.3,
        ior:1.45,
        side:THREE.DoubleSide
    });

    const body = new THREE.Mesh(
        new THREE.CylinderGeometry(0.26, 0.22, 2.0, 32, 1, true),
        glass
    );
    body.position.y = 1.0;
    body.castShadow = true;
    group.add(body);

    const base = new THREE.Mesh(
        new THREE.CylinderGeometry(0.32, 0.32, 0.08, 32),
        glass
    );
    base.position.y = 0.04;
    group.add(base);

    const liquid = new THREE.Mesh(
        new THREE.CylinderGeometry(0.2, 0.2, 0.9, 32),
        new THREE.MeshStandardMaterial({ color:0xffb300, roughness:0.15, transparent:true, opacity:0.9 })
    );
    liquid.position.y = 0.5;
    group.add(liquid);

    const markMaterial = new THREE.MeshStandardMaterial({ color:0x333333 });

    for (let i = 1; i <= 4; i++){
        const mark = new THREE.Mesh(
            new THREE.TorusGeometry(0.255, 0.008, 8, 32),
            markMaterial
        );
        mark.rotation.x = Math.PI / 2;
        mark.position.y = i * 0.38;
        group.add(mark);
    }

    return group;
}

/* -------------------------------------------------- */
/* Laboratory Stand (retort stand) */
/* -------------------------------------------------- */

function createStand(){

    const group = new THREE.Group();

    const metal = new THREE.MeshStandardMaterial({
        color:0x9aa0a6,
        metalness:0.95,
        roughness:0.22
    });

    const base = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.08, 0.62), metal);
    base.position.y = 0.04;
    group.add(base);

    const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 2.3, 24), metal);
    rod.position.set(-0.36, 1.19, 0);
    group.add(rod);

    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.045, 0.045), metal);
    arm.position.set(-0.06, 1.85, 0);
    group.add(arm);

    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.28, 0.026, 16, 32), metal);
    ring.rotation.x = Math.PI / 2;
    ring.position.set(0.22, 1.85, 0);
    group.add(ring);

    group.traverse(o => {
        if (o.isMesh){ o.castShadow = true; o.receiveShadow = true; }
    });

    return group;
}

/* -------------------------------------------------- */
/* Measuring Ruler */
/* -------------------------------------------------- */

function createRuler(){

    const group = new THREE.Group();

    const base = new THREE.Mesh(
        new THREE.BoxGeometry(3.2, 0.03, 0.35),
        new THREE.MeshStandardMaterial({ color:0xf0e4c8, roughness:0.6 })
    );
    base.castShadow = true;
    base.receiveShadow = true;
    group.add(base);

    const tickMaterial = new THREE.MeshStandardMaterial({ color:0x222222 });

    for (let i = 0; i <= 32; i++){
        const tick = new THREE.Mesh(
            new THREE.BoxGeometry(0.02, 0.035, i % 4 === 0 ? 0.18 : 0.1),
            tickMaterial
        );
        tick.position.set(-1.6 + i * 0.1, 0.018, 0.1);
        group.add(tick);
    }

    return group;
}

/* -------------------------------------------------- */
/* Small Metallic Apparatus */
/* -------------------------------------------------- */

function createApparatus(){

    const group = new THREE.Group();

    const metal = new THREE.MeshStandardMaterial({
        color:0xb0b4b8,
        metalness:1,
        roughness:0.18
    });

    const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.4, 0.1, 32), metal);
    foot.position.y = 0.05;
    group.add(foot);

    const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), metal);
    body.position.y = 0.4;
    group.add(body);

    const knob = new THREE.Mesh(new THREE.SphereGeometry(0.12, 32, 32), metal);
    knob.position.y = 0.72;
    group.add(knob);

    group.traverse(o => {
        if (o.isMesh){ o.castShadow = true; o.receiveShadow = true; }
    });

    return group;
}

/* -------------------------------------------------- */
/* Assemble Scene */
/* -------------------------------------------------- */

createLighting(scene);

scene.add(createFloor());
scene.add(createWall());
scene.add(createTable());

/* Beaker + contents (depth test: middle object) */

const beakerMat = createLabMat();
beakerMat.position.set(0, TABLE_TOP_Y + 0.005, 0);
beakerMat.receiveShadow = true;
scene.add(beakerMat);

const beaker = createBeaker();
beaker.position.set(0, TABLE_TOP_Y, 0);
scene.add(beaker);

// Sphere rests naturally near the bottom of the beaker instead of floating
// unnaturally mid-air.
const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(0.38, 64, 64),
    new THREE.MeshStandardMaterial({ color:0xd6362b, roughness:0.35, metalness:0.08 })
);
sphere.position.set(-0.12, 0.42, 0.05);
sphere.castShadow = true;
beaker.add(sphere);

// Second object inside, overlapping the sphere slightly so a single
// screenshot clearly demonstrates overlapping geometry inside the container.
const innerCube = new THREE.Mesh(
    new THREE.BoxGeometry(0.34, 0.34, 0.34),
    new THREE.MeshStandardMaterial({ color:0x2962ff, roughness:0.4, metalness:0.1 })
);
innerCube.position.set(0.26, 0.4, -0.08);
innerCube.rotation.set(0.3, 0.5, 0.1);
innerCube.castShadow = true;
beaker.add(innerCube);

/* Laboratory stand behind the beaker (depth test: back object) */

const stand = createStand();
stand.position.set(0, TABLE_TOP_Y, -2.3);
scene.add(stand);

/* Small metallic apparatus in front of the beaker (depth test: front object) */

const apparatus = createApparatus();
apparatus.position.set(0, TABLE_TOP_Y, 2.1);
scene.add(apparatus);

/* Additional lab equipment for a richer scene */

const flask = createFlask();
flask.position.set(-2.8, TABLE_TOP_Y, -1.0);
scene.add(flask);

const measurementCylinder = createMeasurementCylinder();
measurementCylinder.position.set(3.0, TABLE_TOP_Y, 0.8);
scene.add(measurementCylinder);

const testTube = createTestTube();
testTube.position.set(-3.2, TABLE_TOP_Y, 1.6);
scene.add(testTube);

const ruler = createRuler();
ruler.position.set(0.6, TABLE_TOP_Y + 0.02, -2.7);
ruler.rotation.y = 0.3;
scene.add(ruler);

/* -------------------------------------------------- */
/* Animation */
/* -------------------------------------------------- */

const clock = new THREE.Clock();

function animate(){

    requestAnimationFrame(animate);

    const elapsed = clock.getElapsedTime();

    controls.update();

    // Subtle, professional motion: beaker drifts slowly, the sphere bobs
    // gently near the bottom, and only one instrument (the graduated
    // cylinder) turns slowly — avoids a "everything is spinning" look.
    beaker.rotation.y += 0.001;
    sphere.position.y = 0.42 + Math.sin(elapsed * 0.9) * 0.025;
    innerCube.rotation.y += 0.002;

    measurementCylinder.rotation.y -= 0.0008;

    renderer.render(scene, camera);

}

animate();

/* -------------------------------------------------- */
/* Resize */
/* -------------------------------------------------- */

window.addEventListener("resize", () => {

    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

});

</script>

</body>
</html>
